<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="gearFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="6" fill="url(#bg)"/>

  <!-- Subtle bottom border accent -->
  <rect x="0" y="196" width="900" height="4" rx="0" fill="#4a5568" opacity="0.3"/>

  <!-- Gear/Cog icon (simple geometric) -->
  <g transform="translate(145, 88)" fill="none" stroke="#4a5568" stroke-width="2.5" opacity="0.6">
    <!-- Outer gear teeth -->
    <path d="M0,-32 L4,-28 L4,-22 L8,-20 L14,-24 L18,-20 L16,-14 L20,-8 L26,-8 L28,-2 L24,2 L26,8 L32,10 L32,16 L26,18 L26,24 L30,28 L26,32 L20,30 L14,32 L14,38 L8,38 L6,32 L0,30 L-6,32 L-8,38 L-14,38 L-14,32 L-20,30 L-26,32 L-30,28 L-26,24 L-26,18 L-32,16 L-32,10 L-26,8 L-24,2 L-28,-2 L-26,-8 L-20,-8 L-16,-14 L-18,-20 L-14,-24 L-8,-20 L-4,-22 L-4,-28 Z" fill="url(#gearFill)" stroke="#4a5568"/>
    <!-- Inner circle -->
    <circle cx="0" cy="5" r="12" fill="#1a1d23" stroke="#4a5568"/>
    <!-- Center dot -->
    <circle cx="0" cy="5" r="4" fill="#4a5568"/>
  </g>

  <!-- Anvil shape (simplified geometric) -->
  <g transform="translate(82, 70)" fill="#4a5568" opacity="0.45">
    <!-- Anvil top (flat surface) -->
    <rect x="0" y="0" width="50" height="8" rx="2"/>
    <!-- Anvil horn (pointed end) -->
    <polygon points="50,0 68,4 50,8"/>
    <!-- Anvil body -->
    <path d="M5,8 L45,8 L42,28 L38,28 L38,36 L12,36 L12,28 L8,28 Z"/>
    <!-- Anvil base -->
    <rect x="6" y="36" width="38" height="6" rx="1"/>
  </g>

  <!-- Title: IRONWORKS -->
  <text x="470" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="52" fill="#ffffff" letter-spacing="14">IRONWORKS</text>

  <!-- Subtitle -->
  <text x="470" y="128" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">Development pipeline for AI coding agents</text>

  <!-- Subtle decorative lines -->
  <line x1="220" y1="148" x2="720" y2="148" stroke="#4a5568" stroke-width="0.5" opacity="0.4"/>
</svg>